name: Smoke test debug

# Temporary: runs only BlockingSmokeTest and prints logcat, to debug the v1.6.1 release failure.
on:
  push:
    branches:
      - msbelaid/debug-blocking-smoke-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run smoke test and dump logcat
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon --max-workers=1 connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.plugbrain.android.blocking.BlockingSmokeTest > gradle.txt 2>&1; echo $? > status.txt
            tail -60 gradle.txt
            adb logcat -d -v time > logcat.txt
            grep -E "MathLockService|AppsUsageStats|TestRunner|AndroidRuntime|ActivityTaskManager: (START|Displayed)" logcat.txt | grep -v "^--" | tail -1500
            test "$(cat status.txt)" = "0"
