name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The full CI pipeline, including the @RealTimeTest UI tests that only run on release tags.
  ci:
    uses: ./.github/workflows/release-build.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  sign_and_release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Decode and configure keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > plugbrain-release.keystore
          mv plugbrain-release.keystore app/plugbrain-release.keystore
          echo "storeFile=plugbrain-release.keystore" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            # R8 mapping, to turn stack traces from this release back into real names and lines.
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
