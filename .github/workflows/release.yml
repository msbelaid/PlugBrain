name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  # The full CI pipeline, including the @RealTimeTest UI tests that only run on release tags.
  ci:
    uses: ./.github/workflows/release-build.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    secrets: inherit

  sign_and_release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK and Gradle
        uses: ./.github/actions/setup-gradle-build

      - name: Decode and configure keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/plugbrain-release.keystore
          {
            echo "storeFile=plugbrain-release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed APK
        run: |
          ./gradlew assembleRelease
          ./gradlew bundleRelease

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            # R8 mapping, to turn stack traces from this release back into real names and lines.
            app/build/outputs/mapping/release/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the bundle for the Play upload
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 7

  # Uploads the signed AAB to the Play internal track, as a draft for now (fastlane lane "internal").
  # Skips with a notice when the PLAY_SERVICE_ACCOUNT_JSON secret is missing.
  play_internal:
    name: Play internal track
    needs: sign_and_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"
      FASTLANE_SKIP_DOCS: "1"
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download the bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle
          path: release-bundle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Upload to the internal track
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, skipping the Play upload."
            exit 0
          fi
          bundle exec fastlane internal \
            aab:"$GITHUB_WORKSPACE/release-bundle/bundle/release/app-release.aab" \
            mapping:"$GITHUB_WORKSPACE/release-bundle/mapping/release/mapping.txt"

  # Puts the PRs and issues shipped in this release in a vX.Y.Z milestone.
  milestone:
    needs: sign_and_release
    uses: ./.github/workflows/release-milestone.yml
    permissions:
      contents: read
      issues: write
      pull-requests: write
    with:
      tag: ${{ github.ref_name }}
