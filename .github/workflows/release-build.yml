name: PlugBrain CI

on:
  push:
    # Runs on master save the Gradle cache that pull requests read from.
    branches:
      - master
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole pipeline on v* tags before it signs the release.
  workflow_call:

permissions:
  contents: read

jobs:
  # Tells the UI Tests job whether a pull request touches anything besides docs and store
  # metadata. Pushes and release tags always count as code changes.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - name: Check changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # A file counts as code only when it matches none of the excluded paths.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!LICENSE'
              - '!assets/**'
              - '!fastlane/**'
              - '!.design/**'
              - '!.github/ISSUE_TEMPLATE/**'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run KtLint
        run: ./gradlew ktlintCheck

  detekt:
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run detekt
        run: ./gradlew detekt

      - name: Upload detekt report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: detekt-report
          path: build/reports/detekt/

      # Shows findings inline on the PR. Pull requests from forks get a read-only token, so they skip it.
      - name: Upload SARIF to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('build/reports/detekt/detekt.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  android-lint:
    name: Android Lint
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lints app, appusage, designsystem, challenges and datastore in one report (checkDependencies).
      - name: Run Android Lint
        run: ./gradlew :app:lintRelease

      - name: Print Android Lint findings
        if: ${{ failure() && hashFiles('app/build/reports/lint-results-release.txt') != '' }}
        run: cat app/build/reports/lint-results-release.txt

      - name: Upload Android Lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-release.*

      # Shows findings inline on the PR. Pull requests from forks get a read-only token, so they skip it.
      - name: Upload SARIF to GitHub code scanning
        if: ${{ !cancelled() && hashFiles('app/build/reports/lint-results-release.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/build/reports/lint-results-release.sarif
          category: android-lint

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build installable APK (signed with the CI test key)
        run: ./gradlew assembleRelease -PsignWithTestKey

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: plugbrain-release-test-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # apk-size.yml compares this with the size from the latest master run and comments on the PR.
      - name: Record APK size
        run: stat -c %s app/build/outputs/apk/release/app-release.apk > apk-size.txt

      - name: Upload APK size
        uses: actions/upload-artifact@v4
        with:
          name: apk-size
          path: apk-size.txt

      # Debug build shows debug-only UI (e.g. the difficulty label) and installs
      # alongside the release app thanks to the ".debug" applicationId suffix.
      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plugbrain-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  apk-size:
    name: APK size limit
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Largest growth over master allowed without the apk-size-approved label.
      MAX_GROWTH_KB: 100
    steps:
      - name: Download APK size
        uses: actions/download-artifact@v4
        with:
          name: apk-size
          path: pr

      # Reads the labels now rather than from the event, so re-running this job after adding the
      # label lets the pull request through.
      - name: Compare with master
        run: |
          pr_size=$(cat pr/apk-size.txt)
          base_run=$(gh run list -w release-build.yml -b master -e push -s success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$base_run" ] || ! gh run download "$base_run" -n apk-size -D base; then
            echo "No size from master yet, nothing to compare with."
            exit 0
          fi
          base_size=$(cat base/apk-size.txt)
          growth_kb=$(( (pr_size - base_size) / 1024 ))
          echo "master: $base_size bytes, this PR: $pr_size bytes, growth: $growth_kb KB (limit $MAX_GROWTH_KB KB)"
          if [ "$growth_kb" -le "$MAX_GROWTH_KB" ]; then
            exit 0
          fi
          if gh pr view ${{ github.event.pull_request.number }} --json labels -q '.labels[].name' | grep -qx apk-size-approved; then
            echo "Over the limit, but the apk-size-approved label allows it."
            exit 0
          fi
          echo "::error::The release APK grows by $growth_kb KB, more than the $MAX_GROWTH_KB KB allowed. If the growth is expected, add the apk-size-approved label and re-run this job."
          exit 1

  unit-tests:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs the unit tests of every module, merges their coverage into one report and prints the
      # total, then fails if it is below the floor set in the root build.gradle.kts.
      - name: Run Unit Tests with coverage
        run: ./gradlew test koverXmlReport koverLog koverVerify

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml
          # Only the merged report: the per-module ones would be counted twice.
          disable_search: true
          fail_ci_if_error: false

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            **/build/reports/tests/
            **/build/test-results/

  screenshot-tests:
    name: Screenshot Tests (Paparazzi)
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # verifyPaparazziDebug runs the whole unit test task, so only the screenshot tests are
      # picked here; the Unit Tests job runs the rest.
      - name: Verify Paparazzi snapshots
        run: ./gradlew verifyPaparazziDebug --tests 'app.plugbrain.android.screenshots.*'

      - name: Upload Paparazzi report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-report
          path: |
            app/build/paparazzi/
            designsystem/build/paparazzi/

  ui-tests:
    name: UI Tests
    needs: [changes, build, unit-tests, screenshot-tests]
    # Skipped when a pull request only changes docs or store metadata. The emulator already ran
    # on the pull request, so merges to master skip it too.
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
    strategy:
      matrix:
        api-level: [30]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Instrumented Tests
        # The onboarding tests go through the system Settings app, so they take a few minutes more.
        # @RealTimeTest tests wait for real minutes of app use, so only release tags run them.
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-shutdown: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --max-workers=1 connectedAndroidTest ${{ !startsWith(github.ref, 'refs/tags/v') && '-Pandroid.testInstrumentationRunnerArguments.notAnnotation=app.plugbrain.android.RealTimeTest' || '' }}

      - name: Ensure Emulator is Dead
        if: always()
        run: adb -s emulator-5554 emu kill || pkill -9 -f "emulator" || true

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results-api-${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            **/build/outputs/connected_android_test_additional_output/
