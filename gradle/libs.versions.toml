[versions]
agp = "8.13.2"
kotlin = "2.2.21"
coreKtx = "1.13.1"
coilCompose = "3.1.0"
junit = "4.13.2"
junitVersion = "1.2.1"
uiautomator = "2.3.0"
lifecycleRuntimeKtx = "2.8.7"
kotlinxCoroutines = "1.8.1"
activityCompose = "1.10.1"
composeBom = "2025.07.00"
ktlint = "14.2.0"
# ktlint engine run by the plugin. 1.3+ enables class-signature and chain-method-continuation, which reformat most files.
ktlintEngine = "1.0.1"
koin = "4.0.3"
datastoreCoreAndroid = "1.1.4"
timber = "5.0.1"
mockitoVersion = "5.17.0"
mockitoKotlinVersion = "5.4.0"
paparazzi = "1.3.5"
kover = "0.9.11"
detekt = "1.23.8"
# Newest compose-rules release built for detekt 1.23 on Kotlin 2.0; later ones need a newer Kotlin than detekt runs on.
composeRulesDetekt = "0.4.22"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

#Coil Image loader
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }

#Koin Dependecy Injection
koin_core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin_android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin_test = { module = "io.insert-koin:koin-test", version.ref = "koin" }

#DataStore
androidx-datastore-core-android = { group = "androidx.datastore", name = "datastore-core-android", version.ref = "datastoreCoreAndroid" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastoreCoreAndroid" }
androidx-datastore-preferences-core = { module = "androidx.datastore:datastore-preferences-core", version.ref = "datastoreCoreAndroid" }

#Coroutines
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }

#Timber
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

#Mockito
mockito = {module ="org.mockito:mockito-core", version.ref ="mockitoVersion"}
mockito-kotlin = {module ="org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlinVersion" }

#Screenshot testing - Paparazzi
paparazzi = { module = "app.cash.paparazzi:paparazzi", version.ref = "paparazzi" }

#Static analysis - Compose rules for detekt
compose-rules-detekt = { module = "io.nlopez.compose.rules:detekt", version.ref = "composeRulesDetekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
paparazzi = { id = "app.cash.paparazzi", version.ref = "paparazzi" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
